name: Refresh map data

on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "data/gym_prices.json"
      - ".github/workflows/refresh-data.yml"

permissions:
  contents: write

concurrency:
  group: refresh-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: POIs from OpenStreetMap (Geofabrik extract, Overpass as fallback)
        timeout-minutes: 20
        run: |
          pip install --quiet osmium
          if curl -fsSL --retry 3 -o /tmp/koeln.osm.pbf \
               https://download.geofabrik.de/europe/germany/nordrhein-westfalen/koeln-regbez-latest.osm.pbf; then
            python3 scripts/build_pois.py --pbf /tmp/koeln.osm.pbf
          else
            python3 scripts/build_pois.py
          fi

      - name: Download GTFS timetables (gtfs.de / DELFI)
        run: |
          mkdir -p /tmp/gtfs
          curl -fsSL -o /tmp/gtfs/rv.zip https://download.gtfs.de/germany/rv_free/latest.zip
          curl -fsSL -o /tmp/gtfs/fv.zip https://download.gtfs.de/germany/fv_free/latest.zip
          unzip -q /tmp/gtfs/rv.zip -d /tmp/gtfs/rv
          unzip -q /tmp/gtfs/fv.zip -d /tmp/gtfs/fv

      - name: Train stations with direct connections
        run: python3 scripts/build_stations.py /tmp/gtfs/rv /tmp/gtfs/fv

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pois.json data/stations.json
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Refresh map data ($(date -u +%Y-%m-%d))"
          git push
